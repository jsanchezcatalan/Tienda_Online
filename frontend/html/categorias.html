<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías - Tienda Online</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../scss/main.scss">
</head>
<body class="bg-light">
    <!-- Navbar Simple -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <i class="bi bi-shop"></i> Tienda Online
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="categorias.html">Categorías</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="carrito.html">
                            Carrito <span class="badge bg-danger" id="cartBadge">0</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="btnLogout">Salir</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <div class="container my-5">
        <!-- Header -->
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold">
                <i class="bi bi-grid-fill text-primary"></i> Categorías
            </h1>
            <p class="lead text-muted">Explora nuestras categorías de productos</p>
        </div>

        <!-- Categorías Grid -->
        <div class="row g-4 mb-5" id="categoriasGrid">
            <!-- Spinner mientras carga -->
            <div class="col-12 text-center">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2">Cargando categorías...</p>
            </div>
        </div>

        <!-- Productos de la Categoría Seleccionada -->
        <div id="productosSeccion" style="display: none;">
            <hr class="my-5">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold" id="categoriaTitulo">Productos</h2>
                <button class="btn btn-outline-secondary" id="btnVolverCategorias">
                    <i class="bi bi-arrow-left"></i> Volver a categorías
                </button>
            </div>

            <div class="row g-4" id="productosGrid">
                <!-- Los productos se cargarán aquí -->
            </div>
        </div>
    </div>

    <!-- Footer Simple -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2024 Tienda Online - Todos los derechos reservados</p>
        </div>
    </footer>

    <!-- Toast Notificaciones -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="notificationToast" class="toast" role="alert">
            <div class="toast-header">
                <i class="bi bi-check-circle-fill text-success me-2"></i>
                <strong class="me-auto">Notificación</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastMessage"></div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Scripts -->
    <script src="../js/store.js" type="module"></script>
    <script src="../js/categorias.js" type="module"></script>
</body>
</html>
