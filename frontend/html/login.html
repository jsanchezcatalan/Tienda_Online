<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tienda Online</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../scss/main.scss">
</head>
<body class="bg-light">
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5">
                <!-- Logo -->
                <div class="text-center mb-4">
                    <h1 class="display-5 fw-bold text-primary">
                        <i class="bi bi-shop"></i> Tienda Online
                    </h1>
                    <p class="text-muted">Inicia sesión para continuar</p>
                </div>

                <!-- Card de Login -->
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <!-- Alertas -->
                        <div id="alertContainer"></div>

                        <!-- Formulario -->
                        <form id="loginForm">
                            <!-- Usuario -->
                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    <i class="bi bi-person"></i> Usuario
                                </label>
                                <input 
                                    type="text" 
                                    class="form-control" 
                                    id="username" 
                                    placeholder="Ingresa tu usuario"
                                    required
                                >
                            </div>

                            <!-- Contraseña -->
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    <i class="bi bi-lock"></i> Contraseña
                                </label>
                                <input 
                                    type="password" 
                                    class="form-control" 
                                    id="password" 
                                    placeholder="Ingresa tu contraseña"
                                    required
                                >
                            </div>

                            <!-- Botón Login -->
                            <button type="submit" class="btn btn-primary w-100 mb-3" id="btnLogin">
                                <span id="btnLoginText">
                                    <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
                                </span>
                                <span id="btnLoginSpinner" class="d-none">
                                    <span class="spinner-border spinner-border-sm"></span> Cargando...
                                </span>
                            </button>
                        </form>

                        <!-- Usuarios de Prueba -->
                        <hr>
                        <div class="text-center">
                            <small class="text-muted d-block mb-2">Usuarios de prueba:</small>
                            <div class="d-grid gap-2">
                                <button class="btn btn-sm btn-outline-secondary test-user-btn" 
                                        data-username="admin" 
                                        data-password="admin123">
                                    Admin / admin123
                                </button>
                                <button class="btn btn-sm btn-outline-secondary test-user-btn" 
                                        data-username="carlos" 
                                        data-password="carlos123">
                                    Carlos / carlos123
                                </button>
                                <button class="btn btn-sm btn-outline-secondary test-user-btn" 
                                        data-username="usuario" 
                                        data-password="usuario123">
                                    Usuario / usuario123
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <div class="text-center mt-3">
                    <small class="text-muted">&copy; 2024 Tienda Online</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script de Auth -->
    <script src="../js/auth.js" type="module"></script>
</body>
</html>
