<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producto - Tienda Online</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../scss/main.scss">
</head>
<body class="bg-light">
    <!-- Navbar Simple -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <i class="bi bi-shop"></i> Tienda Online
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="categorias.html">Categorías</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="carrito.html">
                            Carrito <span class="badge bg-danger" id="cartBadge">0</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="btnLogout">Salir</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido del Producto -->
    <div class="container my-5">
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="dashboard.html">Inicio</a></li>
                <li class="breadcrumb-item"><a href="categorias.html">Categorías</a></li>
                <li class="breadcrumb-item active" id="breadcrumbProducto">Producto</li>
            </ol>
        </nav>

        <!-- Detalle del Producto -->
        <div class="card shadow-sm border-0" id="productoCard">
            <div class="card-body p-0">
                <div class="row g-0">
                    <!-- Imagen del Producto -->
                    <div class="col-md-6">
                        <div class="p-4 bg-white h-100 d-flex align-items-center justify-content-center">
                            <img id="productoImagen" 
                                 src="" 
                                 alt="Producto" 
                                 class="img-fluid rounded"
                                 style="max-height: 500px; object-fit: contain;">
                        </div>
                    </div>

                    <!-- Información del Producto -->
                    <div class="col-md-6">
                        <div class="p-5">
                            <!-- Nombre -->
                            <h1 class="fw-bold mb-3" id="productoNombre">Cargando...</h1>

                            <!-- Precio -->
                            <div class="mb-4">
                                <h2 class="text-primary mb-0">
                                    <i class="bi bi-tag-fill"></i>
                                    <span id="productoPrecio">€0.00</span>
                                </h2>
                            </div>

                            <!-- Descripción -->
                            <div class="mb-4">
                                <h5 class="fw-semibold mb-2">Descripción</h5>
                                <p class="text-muted" id="productoDescripcion"></p>
                            </div>

                            <!-- Stock -->
                            <div class="mb-4">
                                <span class="badge bg-success" id="productoStock">
                                    <i class="bi bi-check-circle"></i> Disponible
                                </span>
                            </div>

                            <!-- Cantidad -->
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Cantidad:</label>
                                <div class="input-group" style="max-width: 150px;">
                                    <button class="btn btn-outline-secondary" type="button" id="btnDecrementar">
                                        <i class="bi bi-dash"></i>
                                    </button>
                                    <input type="number" 
                                           class="form-control text-center" 
                                           id="cantidadInput" 
                                           value="1" 
                                           min="1" 
                                           max="99">
                                    <button class="btn btn-outline-secondary" type="button" id="btnIncrementar">
                                        <i class="bi bi-plus"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Botones de Acción -->
                            <div class="d-grid gap-2">
                                <button class="btn btn-primary btn-lg" id="btnAgregarCarrito">
                                    <i class="bi bi-cart-plus"></i> Agregar al Carrito
                                </button>
                                <button class="btn btn-outline-secondary" onclick="history.back()">
                                    <i class="bi bi-arrow-left"></i> Volver
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Productos Relacionados -->
        <div class="mt-5" id="productosRelacionadosSeccion" style="display: none;">
            <h3 class="fw-bold mb-4">
                <i class="bi bi-stars text-warning"></i> Productos Relacionados
            </h3>
            <div class="row g-4" id="productosRelacionados">
                <!-- Se cargarán productos de la misma categoría -->
            </div>
        </div>
    </div>

    <!-- Footer Simple -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2025 Tienda Online - Todos los derechos reservados</p>
        </div>
    </footer>

    <!-- Toast Notificaciones -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="notificationToast" class="toast" role="alert">
            <div class="toast-header">
                <i class="bi bi-check-circle-fill text-success me-2"></i>
                <strong class="me-auto">Notificación</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastMessage"></div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Scripts -->
    <script src="../js/store.js" type="module"></script>
    <script src="../js/producto.js" type="module"></script>
</body>
</html>
